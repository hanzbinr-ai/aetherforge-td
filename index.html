<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aetherforge TD - Prototype</title>
  <style>
    body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
    canvas { border: 3px solid #333; background: #1e1e1e; box-shadow: 0 0 30px rgba(0,0,0,0.8); border-radius: 8px; }
    #ui { position: absolute; top: 15px; left: 15px; color: #eee; background: rgba(0,0,0,0.6); padding: 12px 16px; border-radius: 10px; backdrop-filter: blur(4px); }
    button { margin: 4px; padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    button:hover { transform: translateY(-1px); filter: brightness(1.1); }
    .totem { background: #e67e22; color: white; }
    .poison { background: #27ae60; color: white; }
    .start { background: #2980b9; color: white; }
  </style>
</head>
<body>
  <div id="ui">
    <div>Base HP: <span id="hp">100</span></div>
    <div>Wave: <span id="wave">1</span></div>
    <div>Resource: <span id="res">80</span></div>
    <div style="margin-top:8px; font-size:12px; color:#aaa;">Resource dari gudang (bukan dari kill)</div>
    <button class="totem" onclick="placeMode='totem'">Totem Api (20)</button>
    <button class="poison" onclick="placeMode='poison'">Tanaman Beracun (25)</button>
    <button class="start" onclick="startWave()">Start Wave</button>
  </div>
  <canvas id="game" width="900" height="600"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let baseHP = 100;
let wave = 1;
let resource = 80;
let placeMode = null;
let enemies = [];
let towers = [];
let projectiles = [];
let particles = [];
let waveActive = false;
let frame = 0;

const path = [
  {x: 50, y: 300}, {x: 220, y: 300}, {x: 220, y: 120},
  {x: 480, y: 120}, {x: 480, y: 420}, {x: 850, y: 420}
];

function updateUI() {
  document.getElementById('hp').textContent = Math.max(0, baseHP);
  document.getElementById('wave').textContent = wave;
  document.getElementById('res').textContent = resource;
}

function spawnParticles(x, y, color, count = 8) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      life: 30 + Math.random() * 20,
      color
    });
  }
}

canvas.addEventListener('click', (e) => {
  if (!placeMode) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const cost = placeMode === 'totem' ? 20 : 25;
  if (resource >= cost) {
    towers.push({ x, y, type: placeMode, range: 110, cooldown: 0 });
    resource -= cost;
    spawnParticles(x, y, placeMode === 'totem' ? '#e67e22' : '#2ecc71', 12);
    updateUI();
  }
  placeMode = null;
});

function startWave() {
  if (waveActive) return;
  waveActive = true;
  const count = 6 + wave * 2;
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      enemies.push({
        x: path[0].x, y: path[0].y,
        hp: 25 + wave * 12,
        maxHp: 25 + wave * 12,
        speed: 0.9 + wave * 0.05,
        pathIndex: 0,
        wobble: Math.random() * Math.PI * 2
      });
    }, i * 700);
  }
}

function gameLoop() {
  frame++;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background grid subtle
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }

  // Path with glow
  ctx.strokeStyle = '#3a3a3a';
  ctx.lineWidth = 36;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(path[0].x, path[0].y);
  path.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.stroke();

  ctx.strokeStyle = '#555';
  ctx.lineWidth = 28;
  ctx.stroke();

  // Base
  ctx.fillStyle = '#1abc9c';
  ctx.shadowColor = '#1abc9c';
  ctx.shadowBlur = 15;
  ctx.fillRect(820, 370, 50, 90);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'white';
  ctx.font = 'bold 13px sans-serif';
  ctx.fillText('BASE', 828, 420);

  // Enemies
  enemies = enemies.filter(e => {
    if (e.hp <= 0) {
      spawnParticles(e.x, e.y, '#e74c3c', 15);
      return false;
    }

    const target = path[e.pathIndex + 1];
    if (!target) {
      baseHP -= 8;
      spawnParticles(e.x, e.y, '#e74c3c', 20);
      updateUI();
      if (baseHP <= 0) {
        alert('Base Hancur! Refresh halaman untuk ulang.');
        baseHP = 0;
      }
      return false;
    }

    const dx = target.x - e.x;
    const dy = target.y - e.y;
    const dist = Math.hypot(dx, dy);
    if (dist < e.speed) e.pathIndex++;
    else {
      e.x += (dx / dist) * e.speed;
      e.y += (dy / dist) * e.speed;
    }

    // Wobble animation
    const wob = Math.sin(frame * 0.2 + e.wobble) * 3;

    ctx.fillStyle = '#c0392b';
    ctx.beginPath();
    ctx.arc(e.x, e.y + wob, 13, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#922';
    ctx.lineWidth = 2;
    ctx.stroke();

    // HP bar
    ctx.fillStyle = '#333';
    ctx.fillRect(e.x - 16, e.y - 22, 32, 5);
    ctx.fillStyle = '#2ecc71';
    ctx.fillRect(e.x - 16, e.y - 22, 32 * (e.hp / e.maxHp), 5);

    return true;
  });

  // Towers
  towers.forEach(t => {
    const pulse = 1 + Math.sin(frame * 0.1) * 0.05;
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.scale(pulse, pulse);

    if (t.type === 'totem') {
      ctx.fillStyle = '#d35400';
      ctx.beginPath();
      ctx.moveTo(0, -18);
      ctx.lineTo(12, 10);
      ctx.lineTo(-12, 10);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#e67e22';
      ctx.fillRect(-6, 4, 12, 10);
    } else {
      ctx.fillStyle = '#27ae60';
      ctx.beginPath();
      ctx.arc(0, 0, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#2ecc71';
      ctx.beginPath();
      ctx.arc(-5, -4, 4, 0, Math.PI * 2);
      ctx.arc(5, -4, 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // Range indicator when hovering logic skipped for simplicity
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2);
    ctx.stroke();

    t.cooldown--;
    if (t.cooldown <= 0) {
      const target = enemies.find(en => Math.hypot(en.x - t.x, en.y - t.y) < t.range);
      if (target) {
        projectiles.push({
          x: t.x, y: t.y,
          tx: target.x, ty: target.y,
          damage: t.type === 'totem' ? 9 : 4,
          type: t.type,
          life: 60
        });
        t.cooldown = t.type === 'totem' ? 35 : 55;
        spawnParticles(t.x, t.y, t.type === 'totem' ? '#f39c12' : '#2ecc71', 4);
      }
    }
  });

  // Projectiles
  projectiles = projectiles.filter(p => {
    const dx = p.tx - p.x;
    const dy = p.ty - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 8 || p.life-- <= 0) {
      const hit = enemies.find(e => Math.hypot(e.x - p.tx, e.y - p.ty) < 25);
      if (hit) {
        hit.hp -= p.damage;
        spawnParticles(p.x, p.y, p.type === 'totem' ? '#f1c40f' : '#2ecc71', 6);
      }
      return false;
    }
    p.x += (dx / dist) * 7;
    p.y += (dy / dist) * 7;

    ctx.fillStyle = p.type === 'totem' ? '#f39c12' : '#2ecc71';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    return true;
  });

  // Particles
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    p.vy += 0.05;
    ctx.globalAlpha = p.life / 40;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 3, 3);
    ctx.globalAlpha = 1;
    return p.life > 0;
  });

  if (waveActive && enemies.length === 0) {
    waveActive = false;
    wave++;
    resource += 15; // sedikit bonus antar wave (bukan dari kill)
    updateUI();
  }

  requestAnimationFrame(gameLoop);
}

updateUI();
gameLoop();
</script>
</body>
</html>
