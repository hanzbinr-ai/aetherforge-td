<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aetherforge TD</title>
  <style>
    body { margin: 0; background: #0f0f0f; color: #eee; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; height: 100vh; overflow: hidden; }
    #menu { width: 340px; background: #1a1a1a; padding: 20px; box-sizing: border-box; border-right: 2px solid #333; overflow-y: auto; flex-shrink: 0; }
    #game-container { flex: 1; display: none; justify-content: center; align-items: center; position: relative; background: #111; }
    #game-container.active { display: flex; }
    canvas { background: #1e1e1e; border-radius: 8px; box-shadow: 0 0 25px rgba(0,0,0,0.8); }
    h2 { margin: 0 0 8px; color: #f39c12; }
    .section { margin-bottom: 22px; }
    .site, .map-node {
      background: #252525; margin: 8px 0; padding: 12px; border-radius: 8px; cursor: pointer;
      border: 2px solid #333; transition: 0.15s;
    }
    .site:hover, .map-node:hover { border-color: #f39c12; }
    button { background: #2980b9; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
    button:hover { filter: brightness(1.1); }
    .res { font-size: 17px; color: #2ecc71; margin-bottom: 8px; }
    #battle-ui {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; align-items: center;
      background: rgba(0,0,0,0.75); padding: 10px 14px; border-radius: 10px;
    }
    #back-btn { position: absolute; top: 15px; left: 15px; z-index: 10; }
  </style>
</head>
<body>
  <div id="menu">
    <h2>Aetherforge</h2>
    <div class="res">Gudang: <span id="warehouse">200</span></div>
    <hr style="border-color:#333; margin:12px 0 18px;">

    <div class="section">
      <h3>Campaign</h3>
      <div class="map-node" onclick="startCampaign()">Stone Age - Path 1</div>
      <div class="map-node" onclick="startCampaign()">Stone Age - Path 2</div>
      <div class="map-node" style="opacity:0.45; cursor:default;">Classical (Locked)</div>
    </div>

    <div class="section">
      <h3>Mining Sites</h3>
      <div class="site" onclick="startMining('grove')">
        Sacred Grove<br><small style="color:#aaa;">Lv.<span id="grove-lv">1</span> • +<span id="grove-out">8</span>/jam</small>
      </div>
      <div class="site" onclick="startMining('rock')">
        Rocky Outcrop<br><small style="color:#aaa;">Lv.<span id="rock-lv">1</span> • +<span id="rock-out">6</span>/jam</small>
      </div>
    </div>

    <div class="section">
      <h3>Base</h3>
      <div>Gudang Lv.<span id="wh-lv">1</span></div>
      <button onclick="upgradeWarehouse()" style="margin-top:6px;">Upgrade Gudang</button>
      <p style="font-size:12px; color:#888; margin-top:10px;">
        50% biaya tower di-refund setelah battle.
      </p>
    </div>
  </div>

  <div id="game-container">
    <button id="back-btn" onclick="endBattle(false)">← Menu</button>
    <canvas id="game" width="820" height="540"></canvas>
    <div id="battle-ui">
      <button onclick="placeMode='totem'">Totem Api (20)</button>
      <button onclick="placeMode='poison'">Tanaman (25)</button>
      <button onclick="startWave()" style="background:#27ae60;">Start Wave</button>
      <span style="margin-left:8px;">Res: <b id="bat-res">0</b></span>
    </div>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const menuEl = document.getElementById('menu');
const gameEl = document.getElementById('game-container');

let warehouse = 200;
let currentMode = null;
let miningType = null;
let miningLevels = { grove: 1, rock: 1 };
let warehouseLevel = 1;

let baseHP = 100, wave = 1, resource = 0, placeMode = null;
let enemies = [], towers = [], projectiles = [], particles = [];
let waveActive = false, frame = 0;
let totalSpentOnTowers = 0;

const path = [{x:30,y:270},{x:190,y:270},{x:190,y:90},{x:460,y:90},{x:460,y:390},{x:780,y:390}];

function updateMenu() {
  document.getElementById('warehouse').textContent = Math.floor(warehouse);
  document.getElementById('grove-lv').textContent = miningLevels.grove;
  document.getElementById('rock-lv').textContent = miningLevels.rock;
  document.getElementById('grove-out').textContent = 8 + (miningLevels.grove - 1) * 6;
  document.getElementById('rock-out').textContent = 6 + (miningLevels.rock - 1) * 5;
  document.getElementById('wh-lv').textContent = warehouseLevel;
}

function showMenu() {
  menuEl.style.display = 'block';
  gameEl.classList.remove('active');
  currentMode = null;
  updateMenu();
}

function endBattle(success) {
  const refund = Math.floor(totalSpentOnTowers * 0.5);
  warehouse += refund;

  let msg = '';
  if (success && currentMode === 'mining') {
    miningLevels[miningType]++;
    const bonus = 35 + miningLevels[miningType] * 8;
    warehouse += bonus;
    msg = `Mining berhasil!\nRefund: +${refund}\nBonus: +${bonus}`;
  } else if (success && currentMode === 'campaign') {
    warehouse += 30;
    msg = `Campaign clear!\nRefund: +${refund}\nBonus: +30`;
  } else if (refund > 0) {
    msg = `Refund 50%: +${refund}`;
  }

  if (msg) alert(msg);
  totalSpentOnTowers = 0;
  showMenu();
}

function startBattle(mode, extra) {
  currentMode = mode;
  miningType = extra || null;
  menuEl.style.display = 'none';
  gameEl.classList.add('active');

  baseHP = 100;
  wave = 1;
  totalSpentOnTowers = 0;

  const bring = Math.min(110 + warehouseLevel * 10, Math.max(80, warehouse));
  resource = bring;
  warehouse = Math.max(0, warehouse - bring);

  enemies = []; towers = []; projectiles = []; particles = [];
  waveActive = false;
  document.getElementById('bat-res').textContent = resource;
  updateMenu();
}

function startCampaign() { startBattle('campaign'); }
function startMining(type) { startBattle('mining', type); }

function upgradeWarehouse() {
  const cost = 60 + warehouseLevel * 35;
  if (warehouse >= cost) {
    warehouse -= cost;
    warehouseLevel++;
    updateMenu();
  } else alert('Butuh ' + cost + ' resource');
}

function spawnParticles(x, y, color, n = 8) {
  for (let i = 0; i < n; i++) {
    particles.push({ x, y, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6, life: 20+Math.random()*18, color });
  }
}

canvas.onclick = e => {
  if (!placeMode) return;
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const cost = placeMode === 'totem' ? 20 : 25;
  if (resource >= cost) {
    towers.push({ x, y, type: placeMode, range: 115, cooldown: 0 });
    resource -= cost;
    totalSpentOnTowers += cost;
    spawnParticles(x, y, placeMode === 'totem' ? '#e67e22' : '#2ecc71', 10);
    document.getElementById('bat-res').textContent = resource;
  }
  placeMode = null;
};

function startWave() {
  if (waveActive) return;
  waveActive = true;
  const cnt = currentMode === 'mining' ? 6 + miningLevels[miningType]*2 : 4 + wave*2;
  for (let i = 0; i < cnt; i++) {
    setTimeout(() => {
      enemies.push({ x: path[0].x, y: path[0].y, hp: 25+wave*12, maxHp: 25+wave*12, speed: 1, pathIndex: 0, w: Math.random()*8 });
    }, i * 600);
  }
}

function loop() {
  requestAnimationFrame(loop);
  if (!currentMode) return;

  frame++;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = '#333'; ctx.lineWidth = 32; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(path[0].x, path[0].y);
  path.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();

  ctx.fillStyle = '#1abc9c'; ctx.fillRect(740, 340, 50, 85);
  ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.fillText('BASE', 748, 385);

  enemies = enemies.filter(e => {
    if (e.hp <= 0) { spawnParticles(e.x, e.y, '#e74c3c', 8); return false; }
    const t = path[e.pathIndex+1];
    if (!t) { baseHP -= 10; return false; }
    const dx = t.x-e.x, dy = t.y-e.y, d = Math.hypot(dx, dy);
    if (d < 4) e.pathIndex++;
    else { e.x += dx/d*e.speed; e.y += dy/d*e.speed; }
    const wob = Math.sin(frame*0.1 + e.w)*2;
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath(); ctx.arc(e.x, e.y+wob, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2ecc71';
    ctx.fillRect(e.x-14, e.y-18, 28*(e.hp/e.maxHp), 3);
    return true;
  });

  towers.forEach(t => {
    ctx.fillStyle = t.type==='totem' ? '#e67e22' : '#27ae60';
    ctx.beginPath(); ctx.arc(t.x, t.y, 15, 0, Math.PI*2); ctx.fill();
    if (--t.cooldown <= 0) {
      const tgt = enemies.find(en => Math.hypot(en.x-t.x, en.y-t.y) < t.range);
      if (tgt) {
        projectiles.push({x:t.x, y:t.y, tx:tgt.x, ty:tgt.y, dmg: t.type==='totem'?10:5, type:t.type});
        t.cooldown = t.type==='totem' ? 26 : 45;
      }
    }
  });

  projectiles = projectiles.filter(p => {
    const dx = p.tx-p.x, dy = p.ty-p.y, d = Math.hypot(dx, dy);
    if (d < 10) {
      const h = enemies.find(e => Math.hypot(e.x-p.tx, e.y-p.ty) < 25);
      if (h) h.hp -= p.dmg;
      return false;
    }
    p.x += dx/d*8; p.y += dy/d*8;
    ctx.fillStyle = p.type==='totem' ? '#f39c12' : '#2ecc71';
    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
    return true;
  });

  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.life--;
    ctx.globalAlpha = p.life/25; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 3, 3); ctx.globalAlpha = 1;
    return p.life > 0;
  });

  document.getElementById('bat-res').textContent = Math.floor(resource);

  if (waveActive && enemies.length === 0) {
    waveActive = false; wave++;
    resource += 10;
    if ((currentMode==='mining' && wave>4) || (currentMode==='campaign' && wave>5)) {
      endBattle(true); return;
    }
  }
  if (baseHP <= 0) endBattle(false);
}

updateMenu();
showMenu();
loop();
</script>
</body>
</html>
