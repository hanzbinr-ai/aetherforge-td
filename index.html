<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aetherforge TD</title>
  <style>
    body { margin: 0; background: #0f0f0f; color: #eee; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; height: 100vh; }
    #menu { width: 320px; background: #1a1a1a; padding: 20px; box-sizing: border-box; border-right: 2px solid #333; overflow-y: auto; }
    #game-container { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
    canvas { background: #1e1e1e; border-radius: 8px; box-shadow: 0 0 20px #000; }
    h2 { margin: 0 0 10px; color: #f39c12; }
    .section { margin-bottom: 25px; }
    .site, .map-node {
      background: #252525; margin: 8px 0; padding: 12px; border-radius: 8px; cursor: pointer;
      border: 2px solid #333; transition: 0.2s;
    }
    .site:hover, .map-node:hover { border-color: #f39c12; transform: translateY(-2px); }
    button { background: #2980b9; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; margin: 4px; }
    button:hover { filter: brightness(1.15); }
    .res { font-size: 18px; color: #2ecc71; }
    #back { position: absolute; top: 15px; left: 340px; z-index: 10; }
  </style>
</head>
<body>
  <div id="menu">
    <h2>Aetherforge</h2>
    <div class="res">Gudang: <span id="warehouse">200</span> Resource</div>
    <hr style="border-color:#333; margin:15px 0;">

    <div class="section">
      <h3>Campaign</h3>
      <div class="map-node" onclick="startCampaign(1)">Stone Age - Path 1</div>
      <div class="map-node" onclick="startCampaign(2)">Stone Age - Path 2</div>
      <div class="map-node" style="opacity:0.5;">Classical (Locked)</div>
    </div>

    <div class="section">
      <h3>Mining Sites</h3>
      <div class="site" onclick="startMining('grove')">
        Sacred Grove<br><small>Essence + Kayu | Lv.<span id="grove-lv">1</span> | +<span id="grove-out">8</span>/jam</small>
      </div>
      <div class="site" onclick="startMining('rock')">
        Rocky Outcrop<br><small>Batu | Lv.<span id="rock-lv">1</span> | +<span id="rock-out">6</span>/jam</small>
      </div>
    </div>

    <div class="section">
      <h3>Base Building</h3>
      <div>Gudang Besar Lv.<span id="wh-lv">1</span></div>
      <button onclick="upgradeWarehouse()">Upgrade Gudang</button>
      <div style="margin-top:10px; font-size:13px; color:#aaa;">
        Berhasil defend mining untuk naik level.
      </div>
    </div>
  </div>

  <div id="game-container">
    <button id="back" onclick="showMenu()" style="display:none;">← Kembali</button>
    <canvas id="game" width="800" height="560"></canvas>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let warehouse = 200;
let currentMode = null;
let miningType = null;
let miningLevels = { grove: 1, rock: 1 };
let warehouseLevel = 1;

let baseHP = 100, wave = 1, resource = 0, placeMode = null;
let enemies = [], towers = [], projectiles = [], particles = [];
let waveActive = false, frame = 0;

const path = [{x:40,y:280},{x:200,y:280},{x:200,y:100},{x:450,y:100},{x:450,y:400},{x:760,y:400}];

function updateMenu() {
  document.getElementById('warehouse').textContent = Math.floor(warehouse);
  document.getElementById('grove-lv').textContent = miningLevels.grove;
  document.getElementById('rock-lv').textContent = miningLevels.rock;
  document.getElementById('grove-out').textContent = 8 + (miningLevels.grove-1)*6;
  document.getElementById('rock-out').textContent = 6 + (miningLevels.rock-1)*5;
  document.getElementById('wh-lv').textContent = warehouseLevel;
}

function showMenu() {
  document.getElementById('menu').style.display = 'block';
  document.getElementById('back').style.display = 'none';
  canvas.style.display = 'none';
  currentMode = null;
  updateMenu();
}

function startBattle(mode, extra) {
  currentMode = mode;
  miningType = extra || null;
  document.getElementById('menu').style.display = 'none';
  document.getElementById('back').style.display = 'block';
  canvas.style.display = 'block';

  baseHP = 100;
  wave = 1;
  // Always give enough to build several towers
  const bring = Math.min(100 + warehouseLevel * 15, Math.max(warehouse, 80));
  resource = bring;
  if (warehouse >= bring) warehouse -= bring;
  else warehouse = 0;

  enemies = []; towers = []; projectiles = []; particles = [];
  waveActive = false;
  updateMenu();
  document.getElementById('bat-res').textContent = resource;
}

function startCampaign() { startBattle('campaign'); }
function startMining(type) { startBattle('mining', type); }

function upgradeWarehouse() {
  const cost = 50 + warehouseLevel * 40;
  if (warehouse >= cost) {
    warehouse -= cost;
    warehouseLevel++;
    updateMenu();
  } else {
    alert('Resource gudang tidak cukup (butuh ' + cost + ')');
  }
}

function spawnParticles(x, y, color, count=8) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*5,
      vy: (Math.random()-0.5)*5,
      life: 25 + Math.random()*15,
      color
    });
  }
}

canvas.addEventListener('click', e => {
  if (!placeMode || !currentMode) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const cost = placeMode === 'totem' ? 20 : 25;
  if (resource >= cost) {
    towers.push({ x, y, type: placeMode, range: 120, cooldown: 0 });
    resource -= cost;
    spawnParticles(x, y, placeMode === 'totem' ? '#e67e22' : '#2ecc71', 12);
    document.getElementById('bat-res').textContent = resource;
  }
  placeMode = null;
});

function startWave() {
  if (waveActive || !currentMode) return;
  waveActive = true;
  const count = currentMode === 'mining' ? 7 + miningLevels[miningType] * 2 : 5 + wave * 2;
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      enemies.push({
        x: path[0].x, y: path[0].y,
        hp: 28 + wave * 14,
        maxHp: 28 + wave * 14,
        speed: 0.95,
        pathIndex: 0,
        wobble: Math.random() * 10
      });
    }, i * 650);
  }
}

const battleUI = document.createElement('div');
battleUI.style.cssText = 'position:absolute; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:8px; align-items:center; background:rgba(0,0,0,0.6); padding:8px 12px; border-radius:8px;';
battleUI.innerHTML = `
  <button onclick="placeMode='totem'">Totem Api (20)</button>
  <button onclick="placeMode='poison'">Tanaman (25)</button>
  <button onclick="startWave()" style="background:#27ae60;">Start Wave</button>
  <span>Resource: <b id="bat-res">0</b></span>
`;
document.getElementById('game-container').appendChild(battleUI);

function gameLoop() {
  if (!currentMode) {
    requestAnimationFrame(gameLoop);
    return;
  }
  frame++;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Path
  ctx.strokeStyle = '#3a3a3a';
  ctx.lineWidth = 34;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(path[0].x, path[0].y);
  path.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.stroke();

  // Base
  ctx.fillStyle = '#16a085';
  ctx.fillRect(720, 340, 55, 90);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText('BASE', 730, 390);

  // Enemies
  enemies = enemies.filter(e => {
    if (e.hp <= 0) {
      spawnParticles(e.x, e.y, '#e74c3c', 10);
      return false;
    }
    const tgt = path[e.pathIndex + 1];
    if (!tgt) {
      baseHP -= 12;
      spawnParticles(e.x, e.y, '#c0392b', 16);
      return false;
    }
    const dx = tgt.x - e.x, dy = tgt.y - e.y;
    const d = Math.hypot(dx, dy);
    if (d < 3) e.pathIndex++;
    else {
      e.x += (dx / d) * e.speed;
      e.y += (dy / d) * e.speed;
    }
    const wob = Math.sin(frame * 0.12 + e.wobble) * 2.5;
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(e.x, e.y + wob, 13, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#27ae60';
    ctx.fillRect(e.x - 15, e.y - 22, 30 * (e.hp / e.maxHp), 4);
    return true;
  });

  // Towers
  towers.forEach(t => {
    ctx.fillStyle = t.type === 'totem' ? '#e67e22' : '#27ae60';
    ctx.beginPath();
    ctx.arc(t.x, t.y, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.stroke();

    t.cooldown--;
    if (t.cooldown <= 0) {
      const tgt = enemies.find(en => Math.hypot(en.x - t.x, en.y - t.y) < t.range);
      if (tgt) {
        projectiles.push({
          x: t.x, y: t.y,
          tx: tgt.x, ty: tgt.y,
          dmg: t.type === 'totem' ? 11 : 6,
          type: t.type
        });
        t.cooldown = t.type === 'totem' ? 28 : 48;
        spawnParticles(t.x, t.y, t.type === 'totem' ? '#f39c12' : '#2ecc71', 3);
      }
    }
  });

  // Projectiles
  projectiles = projectiles.filter(p => {
    const dx = p.tx - p.x, dy = p.ty - p.y;
    const d = Math.hypot(dx, dy);
    if (d < 12) {
      const hit = enemies.find(e => Math.hypot(e.x - p.tx, e.y - p.ty) < 28);
      if (hit) hit.hp -= p.dmg;
      spawnParticles(p.x, p.y, p.type === 'totem' ? '#f1c40f' : '#2ecc71', 6);
      return false;
    }
    p.x += (dx / d) * 9;
    p.y += (dy / d) * 9;
    ctx.fillStyle = p.type === 'totem' ? '#f39c12' : '#2ecc71';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fill();
    return true;
  });

  // Particles
  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.life--;
    ctx.globalAlpha = Math.max(0, p.life / 30);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 3, 3);
    ctx.globalAlpha = 1;
    return p.life > 0;
  });

  document.getElementById('bat-res').textContent = Math.floor(resource);

  if (waveActive && enemies.length === 0) {
    waveActive = false;
    wave++;
    resource += 12;

    if (currentMode === 'mining' && wave > 4) {
      miningLevels[miningType]++;
      warehouse += 40 + miningLevels[miningType] * 10;
      alert(`Berhasil! ${miningType} naik ke Level ${miningLevels[miningType]}`);
      showMenu();
      return;
    }
    if (currentMode === 'campaign' && wave > 6) {
      warehouse += 35;
      alert('Campaign selesai! +35 resource ke gudang');
      showMenu();
      return;
    }
  }

  if (baseHP <= 0) {
    alert('Base hancur. Coba lagi.');
    showMenu();
    return;
  }

  requestAnimationFrame(gameLoop);
}

updateMenu();
showMenu();
gameLoop();
</script>
</body>
</html>
